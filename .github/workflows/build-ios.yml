name: Build Admin iOS App (Tauri v2)

on:
  workflow_dispatch:
    inputs:
      export_ipa:
        description: 'Package as unsigned IPA for Sideloadly / AltStore'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'
    paths:
      - 'src-tauri/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build Tauri v2 iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize Tauri iOS Project
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "Initializing Tauri iOS Xcode project..."
            npx @tauri-apps/cli ios init
          else
            echo "Tauri iOS Xcode project already exists."
          fi

      - name: Build Tauri iOS App
        run: |
          echo "Building iOS binary with Tauri CLI..."
          npx @tauri-apps/cli ios build --ci --no-watch

      - name: Package Unsigned IPA for Sideloading (AltStore / Sideloadly)
        if: ${{ inputs.export_ipa == true || github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Looking for compiled .app bundle..."
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Found .app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r Vigil-Admin-iOS-Unsigned.ipa Payload
            echo "Successfully generated Vigil-Admin-iOS-Unsigned.ipa"
          else
            echo "Warning: .app bundle not found directly; archiving whole build directory."
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigil-admin-ios-ipa
          path: |
            *.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
          retention-days: 14
